name: ESP32-S3 Firmware

# Build the USB-keyboard-to-BLE sketch and publish a complete flashing bundle.
# The downloadable Actions artifact is a ZIP; extract it on Android before flashing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32s3-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Compile and package ESP32-S3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino toolchains and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: esp32s3-firmware-${{ runner.os }}-${{ hashFiles('examples/practical/UsbKeyboardToBle/sketch.yaml') }}
          restore-keys: |
            esp32s3-firmware-${{ runner.os }}-

      - name: Update Arduino library index
        run: arduino-cli lib update-index

      - name: Compile USB keyboard to BLE for ESP32-S3
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --profile esp32s3 \
            --build-path "${RUNNER_TEMP}/esp32keybridge-s3" \
            examples/practical/UsbKeyboardToBle

      - name: Package Android-flashable firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_esp32s3_firmware.py \
            --build-dir "${RUNNER_TEMP}/esp32keybridge-s3" \
            --output-dir "${GITHUB_WORKSPACE}/firmware-artifact" \
            --commit "${GITHUB_SHA}"
          ls -lh firmware-artifact/

      - name: Upload ESP32-S3 firmware ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32KeyBridge-ESP32S3-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
