name=ESP32KeyBridge
version=1.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Bridge keyboard input to keyboard output on ESP32: remap, layers, macros, and layout conversion in between.
paragraph=ESP32KeyBridge sits between a keyboard and the machine that reads it. It takes input from USB Host keyboards, mice, gamepads and MIDI devices, BLE or Bluetooth Classic HID keyboards and mice, GPIO switches, key matrices and rotary encoders, normalizes it into one key model, merges several inputs into one, applies single-step remapping across key kinds, momentary layers, disabled keys, text macros and keyboard layout conversion, and writes the result to USB Device HID, BLE or Classic HID, or a serial Print. The core is portable C++ with no Arduino, ESP-IDF or hardware dependency; adapters are header-only, so a sketch needs EspUsbHost, EspUsbDevice or EspBle only for the adapters it includes. Bluetooth Classic is available only on the original ESP32.
category=Device Control
